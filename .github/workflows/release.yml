# Release: prerelease-first, tag-driven, attested assets.
#
# Pushing a tag builds installers for Windows and Linux, attests build
# provenance, and publishes a GitHub release for that tag. A tag containing
# "-" (e.g. 0.2.0-alpha) publishes as a PRERELEASE; a bare tag (0.2.0)
# publishes as the stable release and must exactly match the version in
# src/rewriteocr/__init__.py. See RELEASING.md for the full procedure.

name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine release type
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Prerelease: stamp the tag into the version file so the published
      # artifact self-reports its prerelease version; the branch is never
      # committed with a suffixed version.
      - name: Stamp prerelease version
        if: steps.meta.outputs.prerelease == 'true'
        shell: bash
        run: |
          python - <<'EOF'
          import os, re
          path = "src/rewriteocr/__init__.py"
          tag = os.environ["TAG"]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{tag}"', text)
          open(path, "w", encoding="utf-8").write(text)
          EOF
        env:
          TAG: ${{ steps.meta.outputs.tag }}

      # Stable: the bare tag must equal the committed version exactly.
      - name: Verify stable tag matches version
        if: steps.meta.outputs.prerelease == 'false'
        shell: bash
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "src")
          from rewriteocr import __version__
          tag = os.environ["TAG"]
          if tag != __version__:
              sys.exit(f"Tag {tag} != __version__ {__version__}; bump the version first.")
          EOF
        env:
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libglib2.0-0 libdbus-1-3

      - name: Install and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyinstaller
          python scripts/check_licenses.py
          pytest -q

      - name: Build application folder
        run: pyinstaller --noconfirm packaging/rewriteocr.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.tag }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$v packaging\installer.iss
          Compress-Archive -Path dist\rewrite-ocr\* -DestinationPath "dist\ReWrite-OCR-Scanner-$v-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ steps.meta.outputs.tag }}"
          bash scripts/build_appimage.sh "$v"
          tar -C dist -czf "dist/ReWrite-OCR-Scanner-$v-linux-x64.tar.gz" rewrite-ocr

      - name: Collect assets
        id: assets
        shell: bash
        run: |
          v="${{ steps.meta.outputs.tag }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            {
              echo "files<<EOF"
              echo "dist/ReWrite-OCR-Scanner-Setup-$v.exe"
              echo "dist/ReWrite-OCR-Scanner-$v-windows-x64.zip"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "files<<EOF"
              echo "dist/ReWrite-OCR-Scanner-$v-x86_64.AppImage"
              echo "dist/ReWrite-OCR-Scanner-$v-linux-x64.tar.gz"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # GitHub does not offer attestation on user-owned private repositories;
      # skip there so the release still publishes (unattested) and attest
      # automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: ${{ steps.assets.outputs.files }}
